name: CI Release Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint Helm Charts
        run: |
          helm lint charts/users
          helm lint charts/events
          helm lint charts/tickets
          helm lint charts/notifications

      - name: Validate Kubernetes Manifests Syntax
        run: |
          helm template test-users charts/users
          helm template test-events charts/events
          helm template test-tickets charts/tickets
          helm template test-notifications charts/notifications