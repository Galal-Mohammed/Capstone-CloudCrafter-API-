apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-users
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/YOUR_GITHUB_USERNAME/CloudCrafter-API.git'
    targetRevision: HEAD
    path: charts/users
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: google-cloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-events
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/YOUR_GITHUB_USERNAME/CloudCrafter-API.git'
    targetRevision: HEAD
    path: charts/events
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: google-cloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true